services:
  backend-base:
    build:
      context: ./backend
      dockerfile: Dockerfile.base
    image: bookmarks-backend-base

  backend:
    build: ./backend
    env_file: ./backend/.env
    image: bookmarks-backend
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    restart: always
    volumes:
      - ./backend/data:/app/data
